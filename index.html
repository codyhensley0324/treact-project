<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section id="landing">
      <nav>
        <div class="nav__container">
          <div class="logo__container">
            <img
              src="./assets/logo.2c489fc453a1783cbadacf914efa3df6.svg"
              alt=""
              class="logo"
            />
            <h1 class="logo__title">Treact</h1>
          </div>
          <ul class="nav__links">
            <li><a href="#about" class="nav__link">About</a></li>
            <li><a href="#blog" class="nav__link">Blog</a></li>
            <li><a href="#pricing" class="nav__link">Pricing</a></li>
            <li><a href="#contact-us" class="nav__link">Contact Us</a></li>
            <div class="login">
              <li><a href="#login" class="nav__link">Login</a></li>
              <li>
                <a href="#sign-up" class="nav__link sign--up__btn">Sign Up</a>
              </li>
            </div>
          </ul>
        </div>
      </nav>

      <header>
        <div class="header__description--wrapper">
          <div class="header__description">
            <h1 class="header__title">
              Beautiful React Templates <span class="purple">for you.</span>
            </h1>
            <p class="header__description--para">
              Our templates are easy to setup, understand and customize. Fully
              modular components with a variety of pages and components.
            </p>
            <div class="header__email">
            <input
              type="email" class="email__input"
              placeholder="Your E-Mail Address"
            />
            <button class="header__btn">Get Started</button>
            </div>
            <p class="customer__list">OUR TRUSTED CUSTOMERS</p>
            <figure class="header__img-1--wrapper">
              <img
                src="./assets/customers-logo-strip.680ac7c2e8ae28161d2c.png"
                alt=""
                class="header__img-1"
              />
            </figure>
          </div>
          </div>
          <div class="header__img-2--wrapper">
            <img
              src="./assets/design-illustration-2.6da6a00b20c07c4a9b65d1870679e1b8.svg"
              alt=""
              class="header__img-2"
            />
          </div>
        </div>
      </header>
    </section>
  </body>
</html>
